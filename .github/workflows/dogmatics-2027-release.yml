name: Dogmatics 2027 subject release
on:
  pull_request:
    paths:
      - 'scripts/build-dogmatics-2027.py'
      - '.github/workflows/dogmatics-2027-release.yml'
      - 'subjects/dogmatics/2027/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dogmatics-2027-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.PUBLICATION_PR_TOKEN }}
          path: public
      - uses: actions/checkout@v4
        with:
          repository: slobodatablichka/gos-exams-2027
          ref: main
          token: ${{ secrets.PUBLICATION_SOURCE_TOKEN }}
          path: private
      - name: Install PDF dependencies
        run: |
          python -m pip install reportlab markdown beautifulsoup4 pypdf pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Validate source documents
        run: |
          python -m py_compile public/scripts/build-dogmatics-2027.py
          python public/scripts/build-dogmatics-2027.py --check --private-root private --source-sha "$(git -C private rev-parse HEAD)"
      - name: Generate subject pages and PDF
        run: python public/scripts/build-dogmatics-2027.py --private-root private --source-sha "$(git -C private rev-parse HEAD)"
      - name: Verify content and existing links
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("public/subjects/dogmatics/2027")
          data=json.loads((r/"pdf-manifest.json").read_text())
          assert len(data["pdfs"])==78
          assert len(list(r.glob("q??-l?.md")))==75
          assert len(list((r/"practice").glob("practicum-??.md")))==10
          assert (r/"source-status.md").is_file()
          for entry in data["pdfs"]:
              f=r/entry["file"]
              assert f.is_file() and f.read_bytes().startswith(b"%PDF-") and f.stat().st_size==entry["bytes"]
          for level in ("l3","l2","l1"):
              assert "review_pending" in (r/f"q23-{level}.md").read_text()
          print("PASS: 75 answers, 12 practical materials, 78 PDF, working q23")
          PY
          python public/scripts/publish-lesson.py check
          git -C public diff --check -- '*.md' '*.json' '*.py' '*.yml'
      - name: Commit generated files to branch
        working-directory: public
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subjects/dogmatics/2027 subjects/dogmatics/index.md subjects/index.md materials/index.md index.md
          git diff --cached --check -- '*.md' '*.json' '*.py' '*.yml'
          if git diff --cached --quiet; then
            echo "Release already built"
          else
            git commit -m "Догматика 2027: 75 ответов и 78 PDF"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
