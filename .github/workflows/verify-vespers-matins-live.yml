name: Verify liturgics vespers and matins table (live)
on:
  push:
    branches: [main]
    paths:
      - 'subjects/liturgics/2027/vespers-matins.md'
      - 'assets/liturgics/vespers-matins-data.json'
      - 'assets/liturgics/vespers-matins-digital.js'
      - 'assets/liturgics/service-signs/**'
      - '.github/workflows/verify-vespers-matins-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  https:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed HTML, digital data, JS, and seven service icons
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, time, urllib.request
          root = pathlib.Path(".")
          base = "https://slobodatablichka.github.io/gos-exams-2027-public"
          relative = {
            "/subjects/liturgics/2027/vespers-matins.html": None,
            "/assets/liturgics/vespers-matins-data.json": root / "assets/liturgics/vespers-matins-data.json",
            "/assets/liturgics/vespers-matins-digital.js": root / "assets/liturgics/vespers-matins-digital.js",
          }
          for name in [
            "shesterichnaya.svg", "slavoslovnaya.svg", "polieleynaya.svg",
            "bdennaya-srednego-svyatogo.svg", "bdennaya-velikogo-svyatogo.svg",
            "gospodskiy-prazdnik.svg", "bogorodichnyy-dvunadesyatyy.svg",
          ]:
            path = "/assets/liturgics/service-signs/" + name
            relative[path] = root / ("assets/liturgics/service-signs/" + name)
          last_error = None
          for attempt in range(32):
            try:
              responses = {}
              for url, local in relative.items():
                request = urllib.request.Request(base + url + "?ci=" + str(attempt), headers={"User-Agent":"gos-exams-liturgics-2027-check", "Cache-Control":"no-cache"})
                with urllib.request.urlopen(request, timeout=25) as response:
                  assert response.status == 200, (url, response.status)
                  remote = response.read()
                if local:
                  assert hashlib.sha256(remote).digest() == hashlib.sha256(local.read_bytes()).digest(), ("stale deployment", url)
                responses[url] = remote
              page = responses["/subjects/liturgics/2027/vespers-matins.html"].decode("utf-8")
              assert 'id="vm-digital"' in page and 'id="vm-table"' in page
              assert 'id="vm-one"' in page and 'id="vm-compare"' in page
              assert 'vespers-matins-data.json' in page
              data = json.loads(responses["/assets/liturgics/vespers-matins-data.json"])
              assert len(data["columns"]) == 17 and len(data["rows"]) == 23
              assert len(data["source_layout"]["body_bands"]) == 29
              assert len(data["source_layout"]["merged_regions"]) == 62
              for url, source in responses.items():
                if url.endswith(".svg"): assert b"<svg" in source[:220], url
              print("LIVE PASS: correct released HTML, latest JSON/JS/SVG, 29 source bands and 62 merges")
              break
            except Exception as exc:
              last_error = str(exc)
              if attempt == 31: raise AssertionError(last_error)
              print("Waiting for GitHub Pages (attempt %d/32): %s" % (attempt+1, last_error),flush=True)
              time.sleep(15)
          PY
