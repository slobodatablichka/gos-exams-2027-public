name: Verify new-only GitHub Pages over HTTPS

on:
  push:
    branches: [main]
    paths:
      - 'subjects/**'
      - 'index.md'
      - 'materials/index.md'
      - '_config.yml'
      - 'scripts/check-live-fos-only-2027.py'
      - '.github/workflows/subject-pages-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify all current answers, PDFs, and removal of old site
        run: python scripts/check-live-fos-only-2027.py --attempts 18 --retry-seconds 10
