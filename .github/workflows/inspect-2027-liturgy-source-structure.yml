name: Inspect flat liturgy source page structure
on:
  push:
    paths: ["scripts/inspect-2027-liturgy-source-structure.py",".github/workflows/inspect-2027-liturgy-source-structure.yml"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect-2027-liturgy-source-structure.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planning/data/site-2027-liturgy-unanchored-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Inspect unanchored BPDS liturgy HTML structure"
            git push origin HEAD:main
          fi
