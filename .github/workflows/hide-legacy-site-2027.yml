name: Publish only official FOS-2027 and hide all older solutions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-*-2027.py'
      - scripts/build-combined-subject-pdfs-2027.py
      - scripts/hide-legacy-site-2027.py
      - .github/workflows/hide-legacy-site-2027.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hide-legacy-site-2027
  cancel-in-progress: false

jobs:
  new-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public website
        uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: true
      - name: Checkout approved private FOS revision
        uses: actions/checkout@v4
        with:
          repository: slobodatablichka/gos-exams-2027
          ref: 77a84e19e0fa2c3eb500c99bd85f3cf4e598e29b
          token: ${{ secrets.PUBLICATION_SOURCE_TOKEN }}
          path: private
      - name: Install PDF dependencies
        run: |
          python -m pip install reportlab markdown beautifulsoup4 pypdf pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core poppler-utils
      - name: Rebuild all six 2027 subjects without older PDF links
        run: |
          set -euo pipefail
          SHA=$(git -C private rev-parse HEAD)
          test "$SHA" = "77a84e19e0fa2c3eb500c99bd85f3cf4e598e29b"
          for builder in build-nt-2027 build-ot-2027 build-church-history-2027 build-russian-church-history-2027 build-dogmatics-2027 build-liturgics-2027; do
            python "public/scripts/$builder.py" --private-root private --source-sha "$SHA"
          done
          python public/scripts/hide-legacy-site-2027.py --root public
          python public/scripts/hide-legacy-site-2027.py --root public --check
          python public/scripts/build-combined-subject-pdfs-2027.py --root public
          python public/scripts/build-combined-subject-pdfs-2027.py --root public --check
      - name: Build site with Jekyll exclusions
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./public
          destination: ./rendered
      - name: Verify 450 current answers and 474 PDFs; all old routes absent
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("rendered")
          for slug in ("nt","ot","oi","rpc","dogmatics","liturgics"):
              for n in range(1,26):
                  for level in ("l3","l2","l1"):
                      page=root/f"subjects/{slug}/2027/q{n:02d}-{level}.html"
                      pdf=root/f"subjects/{slug}/2027/pdf/q{n:02d}-{level}.pdf"
                      assert page.is_file(),f"Missing new HTML {page}"
                      assert pdf.is_file(),f"Missing new PDF {pdf}"
                      assert pdf.read_bytes().startswith(b"%PDF-")
                      assert "sessions/" not in page.read_text(encoding="utf-8"),f"Old link {page}"
              for level in ("l3","l2","l1"):
                  assert (root/f"subjects/{slug}/2027/pdf/{level}.pdf").is_file()
              full = root/f"subjects/{slug}/2027/pdf/full-l3-l2-l1.pdf"
              assert full.is_file() and full.read_bytes().startswith(b"%PDF-")
              index = (root/f"subjects/{slug}/2027/index.html").read_text(encoding="utf-8")
              assert "pdf/full-l3-l2-l1.pdf" in index
              for old in ("index.html","numbers.html","pdf/l1.pdf","pdf/l2.pdf","pdf/l3.pdf","pdf-manifest.json"):
                  assert not (root/f"subjects/{slug}/{old}").exists(),f"Old subject exposed {slug}/{old}"
          assert not (root/"sessions").exists(),"Old sessions exposed"
          for old in ("schedule.html","assignments.html","subjects/navigation-manifest.json","subjects/expansion-navigation-manifest.json"):
              assert not (root/old).exists(),f"Old route exposed {old}"
          for p in ("index.html","subjects/index.html","materials/index.html"):
              html=(root/p).read_text(encoding="utf-8")
              assert "sessions/" not in html, f"Old links in {p}"
              assert "архив" not in html.lower(), f"Archive menu in {p}"
          print("PASS: only new FOS 2027; 450 HTML, 474 PDFs; 23 old sessions and legacy catalogs excluded")
          PY
      - name: Commit approved new-only output
        run: |
          set -euo pipefail
          git -C public config user.name "github-actions[bot]"
          git -C public config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C public add --all subjects index.md materials/index.md scripts/subject_pdf.py
          git -C public diff --cached --check -- '*.md' '*.json' '*.py'
          if git -C public diff --cached --quiet; then
            echo "Official FOS only: already up to date"
          else
            git -C public commit -m "Remove legacy links from all published FOS-2027 pages and PDF editions"
            git -C public push origin HEAD:main
          fi
