name: Validate unique study topics and assignments

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Verify published schedule and materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check unique study topics and aliases
        run: python scripts/check-study-topics.py
      - name: Validate published session routes and link registry
        run: python scripts/publish-lesson.py check
      - name: Test future publication in disposable sandbox
        run: python scripts/test-publish-lesson.py
      - name: Compact final audit for published lesson 15
        run: python scripts/check-publication-final.py 15
      - name: Final stage-8 audit for published lesson 16
        run: python scripts/check-publication-final.py 16 --pr-run 41889848876 --main-run 41889990466 --pages-run 41889988853 --http
      - name: Final stage-8 audit for published lesson 20
        run: python scripts/check-publication-final.py 20 --pr-run 42093465158 --main-run 42093598529 --pages-run 42093598245 --http
      - name: Final stage-8 audit for published lesson 21
        run: python scripts/check-publication-final.py 21 --pr-run 42107807617 --main-run 42107991385 --pages-run 42107991273 --http
