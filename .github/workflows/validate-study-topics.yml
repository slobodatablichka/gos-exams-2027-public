name: Validate unique study topics and assignments

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Verify published schedule and materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check unique study topics and aliases
        run: python scripts/check-study-topics.py
      - name: Validate published session routes and link registry
        run: python scripts/publish-lesson.py check
      - name: Test future publication in disposable sandbox
        run: python scripts/test-publish-lesson.py
