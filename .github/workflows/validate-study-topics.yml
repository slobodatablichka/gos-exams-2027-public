name: Validate official FOS-2027 public sources

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No archive links in official subjects
        run: python scripts/hide-legacy-site-2027.py --root . --check
      - name: One numbered list per subject, 450 approved question pages and PDF manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path(".")
          config=(root/"_config.yml").read_text()
          assert "  - sessions" in config
          assert "  - schedule.md" in config and "  - assignments.md" in config
          source_sha="77a84e19e0fa2c3eb500c99bd85f3cf4e598e29b"
          for slug in ("nt","ot","oi","rpc","dogmatics","liturgics"):
              for level in ("l3","l2","l1"):
                  for n in range(1,26):
                      assert (root/f"subjects/{slug}/2027/q{n:02d}-{level}.md").is_file()
                      assert (root/f"subjects/{slug}/2027/pdf/q{n:02d}-{level}.pdf").is_file()
                  assert (root/f"subjects/{slug}/2027/pdf/{level}.pdf").is_file()
              manifest=json.loads((root/f"subjects/{slug}/2027/pdf-manifest.json").read_text())
              assert manifest["source_sha"]==source_sha
              assert len(manifest["pdfs"])==79
              assert any(x["file"]=="pdf/full-l3-l2-l1.pdf" for x in manifest["pdfs"])
              full = root/f"subjects/{slug}/2027/pdf/full-l3-l2-l1.pdf"
              assert full.is_file() and full.read_bytes().startswith(b"%PDF-")
              index = (root/f"subjects/{slug}/2027/index.md").read_text(encoding="utf-8")
              assert index.count("pdf/full-l3-l2-l1.pdf")==1
              for old in ("index.md","numbers.md","pdf-manifest.json","pdf"):
                  assert f"  - subjects/{slug}/{old}" in config
          print("PASS: 450 official answers, 474 PDFs, 6 synchronized manifests; archive excluded")
          PY
