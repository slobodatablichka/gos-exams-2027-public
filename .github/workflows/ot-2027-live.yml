name: Optional full live FOS-2027 verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Full FOS-2027 HTTPS audit, with old routes absent
        run: python scripts/check-live-fos-only-2027.py --attempts 18 --retry-seconds 10
