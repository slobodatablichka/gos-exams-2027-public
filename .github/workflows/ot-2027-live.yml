name: Verify OT 2027 published pages and PDFs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ot-2027-live.yml
      - scripts/check-ot-2027-live.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Full HTTPS audit 77 HTML 78 PDF and historic routes
        run: python scripts/check-ot-2027-live.py
