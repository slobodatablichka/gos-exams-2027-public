name: Publish editable vespers and matins JSON
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-vespers-matins-json.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode source into editable JSON
        run: |
          python - <<'PY'
          import base64, json, pathlib, zlib
          base = pathlib.Path("assets/liturgics")
          source = base / "vespers-matins-data.deflate.b64"
          data = json.loads(zlib.decompress(base64.b64decode(source.read_text(encoding="utf-8"))).decode("utf-8"))
          assert len(data["columns"]) == 17
          assert len(data["rows"]) == 23
          assert all(len(row["cells"]) == 17 for row in data["rows"])
          destination = base / "vespers-matins-data.json"
          destination.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Exported {len(data['rows'])} rows, {len(data['columns'])} columns")
          PY
      - name: Commit editable JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/liturgics/vespers-matins-data.json
          if ! git diff --cached --quiet; then
            git commit -m "data(liturgics): expose editable text cells as JSON"
            git push
          fi
