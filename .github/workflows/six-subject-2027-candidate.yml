name: Six-subject FOS-2027 release candidate (no publication)

on:
  pull_request:
    paths:
      - 'scripts/preflight-six-subjects-2027.py'
      - '.github/workflows/six-subject-2027-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: six-subject-2027-candidate
  cancel-in-progress: true

jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout publication code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          path: public
      - name: Checkout same private source revision for all subjects
        uses: actions/checkout@v4
        with:
          repository: slobodatablichka/gos-exams-2027
          ref: main
          token: ${{ secrets.PUBLICATION_SOURCE_TOKEN }}
          path: private
      - name: Dependencies for PDF and HTML checks
        run: |
          python -m pip install reportlab markdown beautifulsoup4 pypdf pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core poppler-utils
      - name: Pin exact private source SHA
        run: echo "SOURCE_SHA=$(git -C private rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check all 450 source texts and 150 official formulations
        run: |
          python public/scripts/preflight-six-subjects-2027.py sources \
            --private-root private --source-sha "$SOURCE_SHA" \
            --report source-preflight.json
          for builder in build-nt-2027 build-ot-2027 build-church-history-2027 build-russian-church-history-2027 build-dogmatics-2027 build-liturgics-2027; do
            python "public/scripts/$builder.py" --check --private-root private --source-sha "$SOURCE_SHA"
          done
      - name: Create isolated publication candidate
        run: |
          mkdir -p staged-public
          rsync -a --exclude='.git' public/ staged-public/
          for builder in build-nt-2027 build-ot-2027 build-church-history-2027 build-russian-church-history-2027 build-dogmatics-2027 build-liturgics-2027; do
            python "staged-public/scripts/$builder.py" --private-root private --source-sha "$SOURCE_SHA"
          done
      - name: Validate 450 generated pages and 468 physical PDFs
        run: |
          python public/scripts/preflight-six-subjects-2027.py candidate \
            --private-root private --public-root staged-public \
            --source-sha "$SOURCE_SHA" --report candidate-preflight.json
          diff -qr public/sessions staged-public/sessions
          python staged-public/scripts/publish-lesson.py check
      - name: Compile isolated Jekyll preview without publishing
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./staged-public
          destination: ./rendered-candidate
      - name: Check representative compiled HTML routes
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path("rendered-candidate")
          slugs=("nt","ot","oi","rpc","dogmatics","liturgics")
          for slug in slugs:
              for n in (1,13,24,25):
                  for lev in ("l3","l2","l1"):
                      p=base/f"subjects/{slug}/2027/q{n:02}-{lev}.html"
                      assert p.is_file(), f"Missing rendered HTML: {p}"
              assert (base/f"subjects/{slug}/2027/index.html").is_file()
          print("PASS: 72 representative compiled question routes and six indexes")
          PY
      - name: Keep reports and full candidate for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-subject-2027-release-candidate
          path: |
            source-preflight.json
            candidate-preflight.json
            staged-public/subjects/nt/2027/
            staged-public/subjects/ot/2027/
            staged-public/subjects/oi/2027/
            staged-public/subjects/rpc/2027/
            staged-public/subjects/dogmatics/2027/
            staged-public/subjects/liturgics/2027/
          if-no-files-found: warn
          retention-days: 30
